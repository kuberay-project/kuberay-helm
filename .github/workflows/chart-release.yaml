name: Release Charts
on:
  push:
    branches:
      - main
      - release-*
  # Manual runs release every chart at the selected branch's HEAD, not just charts changed since the last tag.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chart-release
  cancel-in-progress: false
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.8.0
        with:
          charts_dir: helm-chart
          skip_existing: true
          # On manual runs, match no tags so every chart counts as changed and is released.
          match_tags: ${{ github.event_name == 'workflow_dispatch' && 'nonexistent-tag' || '' }}
          oci_registry_url: oci://quay.io/kuberay/helm-charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # The action only forwards skip_existing to `cr upload`; this also applies it to `cr push`.
          CR_SKIP_EXISTING: true
